[tool.poetry]
name = "aws-lambda-emit-heartbeat-metric"
version = "0.0.1"
description = "Simply emits a metric that goes between 0 and 1 every 2 minutes. Used as a heartbeat to test alerting."
authors = ["MDTP Telemetry"]
readme = "README.md"

[[tool.poetry.source]]
name = "artifactory"
url = "https://artefacts.tax.service.gov.uk/artifactory/api/pypi/pips/simple/"
priority = "primary"

[tool.poetry.dependencies]
python = "^3.14.2"
datetime = "^5.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^5.0.0"
flake8 = "^7.0.0"
bandit = "^1.9.3"
pre-commit = "^3.7.0"
cookiecutter = "^2.6.0"
version-incrementor = "^1.10.0"
coverage = "^7.4.4"
black = "23.12.0"
mypy-extensions = "^1.0.0"
pathspec = "^1.0.4"
platformdirs = "^4.2.1"

[tool.poetry.requires-plugins]
poetry-plugin-export = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
